name: Update dashboard JSON data

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 11:15 UTC (6:15 AM Toronto during EST; adjust as you like)
    - cron: "15 11 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run updater
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          node scripts/update_dashboard_data.mjs

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          git diff --staged --quiet || git commit -m "chore(data): refresh dashboard market + valuation data"
          git push
